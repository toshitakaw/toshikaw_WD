name: Deploy WOFI’S website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the static website
        run: pnpm pages:build
        env:
          NEXT_PUBLIC_BASE_PATH: /toshikaw_WD
          NEXT_PUBLIC_SITE_URL: https://toshitakaw.github.io/toshikaw_WD

      - name: Publish the static website branch
        shell: bash
        run: |
          cp -a dist/client "$RUNNER_TEMP/wofis-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan pages-output
          git rm -rf .
          cp -a "$RUNNER_TEMP/wofis-site/." .
          git add -f .
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
